<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Emulator</title>
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      background: #000; 
    }
    #emulator { 
      width: 100%; 
      height: 480px; 
    }
  </style>
</head>
<body>
  <div id="emulator"></div>
  <script>
    // Get parameters from URL
    const urlParams = new URLSearchParams(window.location.search);
    const gameUrl = urlParams.get('gameUrl');
    const core = urlParams.get('core');
    const gameId = urlParams.get('gameId');
    const gameName = urlParams.get('gameName');
    
    // Set EmulatorJS variables
    window.EJS_player = "#emulator";
    window.EJS_core = core;
    window.EJS_pathtodata = "/emulatorjs/";
    window.EJS_gameUrl = gameUrl;
    window.EJS_language = "en-US";
    window.EJS_startOnLoaded = true;
    window.EJS_fullscreenOnLoad = false;
    window.EJS_gameID = gameId;
    window.EJS_gameName = gameName;
    window.EJS_width = "100%";
    window.EJS_height = "480px";
    
    // Mobile detection function
    function isMobileDevice() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
             (window.innerWidth <= 768) ||
             ('ontouchstart' in window);
    }
    
    // Fullscreen function with toggle capability
    function toggleFullscreen() {
      const emulatorElement = document.getElementById('emulator');
      if (!emulatorElement) return;
      
      // Check if currently in fullscreen
      const isFullscreen = document.fullscreenElement || 
                          document.webkitFullscreenElement || 
                          document.mozFullScreenElement || 
                          document.msFullscreenElement;
      
      if (isFullscreen) {
        // Exit fullscreen
        try {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(err => {

            });
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.mozCancelFullScreen) {
            document.mozCancelFullScreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }
        } catch (error) {

        }
      } else {
        // Enter fullscreen

        try {
          if (emulatorElement.requestFullscreen) {
            emulatorElement.requestFullscreen().catch(err => {

            });
          } else if (emulatorElement.webkitRequestFullscreen) {
            emulatorElement.webkitRequestFullscreen();
          } else if (emulatorElement.mozRequestFullScreen) {
            emulatorElement.mozRequestFullScreen();
          } else if (emulatorElement.msRequestFullscreen) {
            emulatorElement.msRequestFullscreen();
          }
        } catch (error) {

        }
      }
    }
    
    // Set up callbacks
    window.EJS_onGameStart = function() {
      parent.postMessage({type: 'gameStarted'}, '*');
      
      // Add fullscreen toggle listeners after game starts
      setTimeout(() => {
        const emulatorElement = document.getElementById('emulator');
        if (emulatorElement) {
          
          if (isMobileDevice()) {
            // Mobile: Use double-tap
            let lastTap = 0;
            emulatorElement.addEventListener('touchend', function(e) {
              const currentTime = new Date().getTime();
              const tapLength = currentTime - lastTap;
              
              if (tapLength < 500 && tapLength > 0) {
                // Double tap detected
                e.preventDefault();
                toggleFullscreen();
              }
              lastTap = currentTime;
            });

            
          } else {
            // Desktop: Use double-click
            emulatorElement.addEventListener('dblclick', function() {
              toggleFullscreen();
            });

          }
        }
      }, 1000);
    };
    
    // Listen for fullscreen requests from parent
    window.addEventListener('message', function(event) {
      if (event.data.type === 'requestFullscreen') {
        toggleFullscreen();
      }
    });
    
    window.EJS_onError = function(error) {
      parent.postMessage({type: 'gameError', error: error}, '*');
    };
  </script>
  <script src="/emulatorjs/loader.js"></script>
</body>
</html>
